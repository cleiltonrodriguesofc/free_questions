# Docker Compose — Desenvolvimento Local
# Uso: docker compose up --build
#
# Para produção (Render), usa o Dockerfile diretamente.

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Hot-reload: monta o código local dentro do container
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
