{% extends "base.html" %}
{% block title %}Criar Conta{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon">⚡</div>
      <h1>Criar Conta</h1>
      <p>Comece a treinar agora mesmo</p>
    </div>

    {% if error %}
    <div class="alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" id="register-form">
      <div class="form-group">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="seu_usuario" required minlength="3" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="mínimo 6 caracteres" required minlength="6" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary btn-full btn-lg" type="submit" id="register-btn">Criar conta →</button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="/login">Fazer login</a>
    </div>
  </div>
</div>
{% endblock %}
